name: macOS Compatibility Smoke
run-name: macOS 27 Compatibility (rehearsal ${{ inputs.rehearsal-run-id }})

on:
    workflow_call:
        inputs:
            rehearsal-run-id:
                description: Run ID containing a successful ARM64 Release Rehearsal artifact
                required: true
                type: string
    workflow_dispatch:
        inputs:
            rehearsal-run-id:
                description: Run ID containing a successful ARM64 Release Rehearsal artifact
                required: true
                type: string

concurrency:
    group: macos-compatibility-${{ inputs.rehearsal-run-id }}
    cancel-in-progress: true

permissions:
    actions: read
    contents: read

jobs:
    compatibility:
        name: Test existing ARM64 DMG on macOS 27
        runs-on: xcode-27
        timeout-minutes: 15
        defaults:
            run:
                shell: bash
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Validate rehearsal artifact provenance
              id: source
              env:
                  GH_TOKEN: ${{ github.token }}
                  REHEARSAL_RUN_ID: ${{ inputs.rehearsal-run-id }}
              run: |
                  [[ "$REHEARSAL_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid rehearsal run ID" >&2; exit 1; }
                  evidence="$RUNNER_TEMP/ffv-macos-compatibility"
                  mkdir -p "$evidence"
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID" > "$evidence/source-run.json"
                  jq -e --arg repo "$GITHUB_REPOSITORY" '
                    .path == ".github/workflows/release-rehearsal.yml" and
                    .event == "workflow_dispatch" and
                    .repository.full_name == $repo and
                    .head_repository.full_name == $repo and
                    (.head_sha | test("^[0-9a-f]{40}$"))
                  ' "$evidence/source-run.json" > /dev/null
                  sha=$(jq -r '.head_sha' "$evidence/source-run.json")
                  gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID/jobs?per_page=100" > "$evidence/source-jobs.json"
                  jq -e 'any(.[].jobs[];
                    .name == "Verify Unsigned Release Package (macos-15, arm64)" and
                    .conclusion == "success"
                  )' "$evidence/source-jobs.json" > /dev/null
                  gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID/artifacts?per_page=100" > "$evidence/source-artifacts.json"
                  jq -e --arg sha "$sha" --argjson run "$REHEARSAL_RUN_ID" '
                    [.[].artifacts[] | select(.name == "release-rehearsal-macos-15-arm64")] |
                    if length != 1 then error("Expected one ARM64 rehearsal artifact") else .[0] end |
                    select(.expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha)
                  ' "$evidence/source-artifacts.json" > "$evidence/source-artifact.json"
                  artifact_id=$(jq -r '.id' "$evidence/source-artifact.json")
                  [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
                  sw_vers > "$evidence/os-version.txt"
                  uname -a >> "$evidence/os-version.txt"
                  printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion" >> "$evidence/os-version.txt"

            - name: Checkout exact artifact source
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: ${{ steps.source.outputs.sha }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .node-version

            - name: Download verified ARM64 rehearsal artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  artifact-ids: ${{ steps.source.outputs.artifact-id }}
                  run-id: ${{ inputs.rehearsal-run-id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ github.token }}
                  path: release-dist
                  merge-multiple: true
                  digest-mismatch: error

            - name: Verify DMG matches original successful smoke
              run: |
                  evidence="$RUNNER_TEMP/ffv-macos-compatibility"
                  cp release-dist/distributable-smoke-darwin-arm64.json "$evidence/source-smoke-report.json"
                  rm release-dist/distributable-smoke-darwin-arm64.json
                  version=$(node -p 'require("./package.json").version')
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  artifact="Fit-File-Viewer-dmg-arm64-$version.dmg"
                  expected=$(jq -er --arg artifact "$artifact" '
                    .artifacts[] | select(.artifact == $artifact and .passed == true and
                    .signatureVerified == true and .launchServicesVerified == true) | .sha256
                  ' "$evidence/source-smoke-report.json")
                  [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
                  actual=$(shasum -a 256 "release-dist/$artifact" | cut -d ' ' -f 1)
                  [[ "$actual" == "$expected" ]] || { echo "DMG differs from original tested artifact" >&2; exit 1; }
                  printf '%s  %s\n' "$actual" "$artifact" > "$evidence/dmg-sha256.txt"

            - name: Smoke test copied DMG through direct launch and LaunchServices
              run: node scripts/run-distributable-smoke.mjs
              env:
                  MATRIX_ARCH: arm64
                  FFV_PACKAGED_SMOKE_TIMEOUT_MS: "60000"

            - name: Preserve macOS compatibility evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: macos-27-compatibility-${{ inputs.rehearsal-run-id }}
                  path: |
                      ${{ runner.temp }}/ffv-macos-compatibility/**
                      release-dist/distributable-smoke-darwin-arm64.json
                      release-dist/smoke-diagnostics/**
                  retention-days: 14
                  if-no-files-found: error
