name: Verify Universal Package
run-name: Verify Universal DMG on Native Intel (${{ inputs.source-sha }})

on:
    workflow_call:
        inputs:
            source-sha:
                description: Exact source commit that produced the Universal DMG
                required: true
                type: string
            expected-version:
                description: Release version when supplied by the version bump job
                required: false
                default: ""
                type: string

permissions:
    actions: read
    contents: read

jobs:
    native-intel:
        name: Verify the ARM64-tested Universal DMG on native Intel
        runs-on: macos-15-intel
        timeout-minutes: 15
        defaults:
            run:
                shell: bash
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - name: Validate exact source revision
              env:
                  SOURCE_SHA: ${{ inputs.source-sha }}
              run: |
                  [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Universal source SHA" >&2; exit 1; }

            - name: Checkout exact Universal artifact source
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: ${{ inputs.source-sha }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .node-version

            - name: Download this run's ARM64-tested Universal DMG
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: universal-native-verification-${{ github.run_attempt }}
                  run-id: ${{ github.run_id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ github.token }}
                  path: source-artifact
                  digest-mismatch: error

            - name: Verify source revision, version, ARM64 smoke and DMG hash
              env:
                  SOURCE_SHA: ${{ inputs.source-sha }}
                  EXPECTED_VERSION: ${{ inputs.expected-version }}
              run: |
                  test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
                  test "$(node -p 'process.arch')" = x64
                  node scripts/verify-universal-native-source.mjs > source-artifact/native-source-verification.json
                  mkdir -p release-dist
                  version=$(node -p 'require("./package.json").version')
                  mv "source-artifact/Fit-File-Viewer-dmg-universal-$version.dmg" release-dist/
                  sw_vers > source-artifact/intel-os-version.txt
                  uname -a >> source-artifact/intel-os-version.txt

            - name: Verify signatures and smoke native x64 direct launch and LaunchServices
              run: node scripts/run-distributable-smoke.mjs
              env:
                  MATRIX_ARCH: universal
                  FFV_PACKAGED_SMOKE_TIMEOUT_MS: "60000"

            - name: Preserve native Universal verification evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: universal-native-intel-evidence-${{ github.run_attempt }}
                  path: |
                      source-artifact/*.json
                      source-artifact/intel-os-version.txt
                      release-dist/distributable-smoke-darwin-universal.json
                      release-dist/smoke-diagnostics/**
                  retention-days: 14
                  if-no-files-found: error
